name: Package test

# Same build as the Release workflow, for test branches (nothing is published). Release: publishes a release whenever the "version" in package.json on main is new:
# builds the native helper and the Windows installer + portable .exe, smoke-tests
# the packaged app, then creates the tag + GitHub release. The app's
# auto-updater picks up the newest release.
on:
  push:
    branches-ignore: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build native helper
        run: dotnet publish helper/NowPlayingHelper.csproj -c Release -o helper/bin

      - name: Helper self-test
        shell: pwsh
        run: |
          & helper/bin/NowPlayingHelper.exe --selftest
          if ($LASTEXITCODE -ne 0) { throw "helper selftest failed" }

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Build installer + portable .exe
        run: npm run dist:win
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - name: Check the package contains the helper
        shell: pwsh
        run: |
          if (-not (Test-Path 'dist/win-unpacked/resources/helper/NowPlayingHelper.exe')) { throw 'helper missing from package' }
          Get-ChildItem dist/*.exe | Select-Object Name, @{n='MB';e={[math]::Round($_.Length/1MB,1)}}

      - name: Write latest.json (for the in-app updater)
        run: node scripts/latest-json.mjs

      - name: Smoke test the packaged app
        continue-on-error: true
        shell: pwsh
        run: |
          $p = Start-Process -FilePath 'dist/win-unpacked/Now Playing.exe' -ArgumentList '--hidden' -PassThru
          Start-Sleep -Seconds 20
          $procs = Get-Process | Where-Object { $_.ProcessName -in 'Now Playing','NowPlayingHelper' }
          $procs | Select-Object ProcessName, Id, @{n='MB';e={[math]::Round($_.WorkingSet64/1MB,1)}} | Format-Table | Out-String | Write-Host
          $log = Join-Path $env:APPDATA 'Now Playing\debug.log'
          if (Test-Path $log) { Get-Content $log | Write-Host } else { Write-Host 'no debug.log' }
          Stop-Process -Name 'Now Playing' -Force -ErrorAction SilentlyContinue
          Stop-Process -Name 'NowPlayingHelper' -Force -ErrorAction SilentlyContinue

      # Windows-only behaviour of the desktop lyrics window: it must stay on top,
      # never take focus, let clicks through (except in Move mode) and draw see-through.
      - name: Desktop lyrics window check
        continue-on-error: true
        shell: pwsh
        run: |
          Add-Type -AssemblyName System.Windows.Forms, System.Drawing
          Add-Type @'
          using System; using System.Runtime.InteropServices;
          public static class W {
            [DllImport("user32.dll", CharSet = CharSet.Unicode)] public static extern IntPtr FindWindow(string cls, string title);
            [DllImport("user32.dll")] public static extern int GetWindowLong(IntPtr h, int i);
            [DllImport("user32.dll")] public static extern bool GetWindowRect(IntPtr h, out RECT r);
            [DllImport("user32.dll")] public static extern IntPtr WindowFromPoint(POINT p);
            [DllImport("user32.dll")] public static extern IntPtr GetAncestor(IntPtr h, uint flags);
            [DllImport("user32.dll")] public static extern IntPtr GetForegroundWindow();
            public struct RECT { public int L, T, R, B; }
            public struct POINT { public int X, Y; }
          }
          '@
          $out = Join-Path $env:RUNNER_TEMP 'overlay-check'
          New-Item -ItemType Directory -Force $out | Out-Null
          function Shot($name) {
            $b = [System.Windows.Forms.Screen]::PrimaryScreen.Bounds
            $bmp = New-Object System.Drawing.Bitmap $b.Width, $b.Height
            $g = [System.Drawing.Graphics]::FromImage($bmp)
            $g.CopyFromScreen($b.Location, [System.Drawing.Point]::Empty, $b.Size)
            $bmp.Save((Join-Path $out "$name.png")); $g.Dispose(); $bmp.Dispose()
          }
          function Check($label) {
            $h = [W]::FindWindow($null, 'Now Playing - desktop lyrics')
            if ($h -eq [IntPtr]::Zero) { Write-Host "${label}: desktop lyrics window NOT FOUND"; return }
            $ex = [W]::GetWindowLong($h, -20)
            $r = New-Object W+RECT
            [W]::GetWindowRect($h, [ref]$r) | Out-Null
            $pt = New-Object W+POINT
            $pt.X = [int](($r.L + $r.R) / 2); $pt.Y = [int]($r.B - 30)
            $hit = [W]::GetAncestor([W]::WindowFromPoint($pt), 2)
            $fg = [W]::GetForegroundWindow()
            Write-Host ("{0}: exstyle=0x{1:X8} topmost={2} click-through={3} layered={4} no-activate={5} tool-window={6} rect=({7},{8})-({9},{10}) a click at its text goes to: {11}; has focus: {12}" -f `
              $label, $ex, [bool]($ex -band 0x8), [bool]($ex -band 0x20), [bool]($ex -band 0x80000), [bool]($ex -band 0x8000000), [bool]($ex -band 0x80), `
              $r.L, $r.T, $r.R, $r.B, $(if ($hit -eq $h) { 'the lyrics window' } else { 'the window underneath' }), ($fg -eq $h))
          }
          foreach ($mode in 'normal', 'move') {
            $env:NP_MOCK = '1'; $env:NP_OVERLAY = '1'
            $env:NP_USERDATA = Join-Path $env:RUNNER_TEMP "npud-$mode"
            if ($mode -eq 'move') { $env:NP_MOVE = '1' } else { Remove-Item Env:NP_MOVE -ErrorAction SilentlyContinue }
            Start-Process -FilePath 'dist/win-unpacked/Now Playing.exe' | Out-Null
            Start-Sleep -Seconds 10
            Check $mode
            Shot $mode
            Stop-Process -Name 'Now Playing' -Force -ErrorAction SilentlyContinue
            Start-Sleep -Seconds 2
          }

      - name: Upload the desktop lyrics check
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: overlay-check
          path: ${{ runner.temp }}/overlay-check
          retention-days: 3
          if-no-files-found: ignore

